<header class="hero">
  <h1>Your LinkedIn, Roasted &amp; Rebuilt</h1>
  <p>Data Analyst Trainee → Data Analyst hunt. Everything below is built only from what you told me — no invented metrics, no fictional achievements. Where something's missing, I'll say so instead of making it up.</p>
</header>
 
<nav class="tabs" id="tabs"></nav>
 
<main id="main"></main>
 
<div class="nav-footer">
  <button id="prevBtn">← Previous</button>
  <button id="nextBtn">Next →</button>
</div>
 
<script>
const tabs = ["Roast", "Rebuild", "Scorecard", "7-Day Plan", "Summary Card"];
const tabsEl = document.getElementById('tabs');
const mainEl = document.getElementById('main');
let current = 0;
 
tabs.forEach((t,i)=>{
  const b = document.createElement('button');
  b.textContent = t;
  b.onclick = ()=>showPanel(i);
  tabsEl.appendChild(b);
});
 
function showPanel(i){
  current = i;
  [...tabsEl.children].forEach((b,idx)=>b.classList.toggle('active', idx===i));
  [...mainEl.children].forEach((p,idx)=>p.classList.toggle('active', idx===i));
  document.getElementById('prevBtn').disabled = i===0;
  document.getElementById('nextBtn').disabled = i===tabs.length-1;
  window.scrollTo({top:0, behavior:'smooth'});
}
document.getElementById('prevBtn').onclick = ()=>showPanel(Math.max(0,current-1));
document.getElementById('nextBtn').onclick = ()=>showPanel(Math.min(tabs.length-1,current+1));
 
// ---------- PANEL 1: ROAST ----------
const roast = document.createElement('section');
roast.className = 'panel';
roast.innerHTML = `
<h2 class="section-title">Part 1 — The Roast</h2>
 
<div class="score-row"><span class="label">Headline</span><span class="score low mono">3/10</span></div>
<p class="reaction">Recruiter's 3-second read: "Another fresher calling themselves an AI Engineer. Next."</p>
<div class="breakdown">
  <p>❌ <b>The problem:</b> Your headline reads <span class="quote">"AI Engineer &amp; Data Analyst | GenAI Developer | Python | SQL | Power BI | Building AI &amp; Data Solutions |"</span> — that's four job titles stacked on top of each other, a dangling trailing pipe, and zero evidence anywhere in your About or Experience of actual "AI Engineering" or "GenAI Development" work. Your real proof points are SQL dashboards, Power BI, and one AI-powered app built with Python/Streamlit.</p>
  <p>🧠 <b>Why it hurts:</b> Recruiters searching for "Data Analyst" skim titles in half a second. When the title claims "AI Engineer," it either (a) filters you OUT of Data Analyst searches because you look like you're chasing a different role, or (b) gets you INTO an AI Engineer search where your profile can't back it up — and you get rejected for misrepresentation, not lack of skill.</p>
  <p>🔍 <b>The invisible cost:</b> You're likely losing visibility in exactly the searches you want (Data Analyst, Business Analyst, SQL Analyst) because the keyword-stuffed title dilutes relevance ranking, and you're not converting the AI Engineer searches you do show up in.</p>
</div>
 
<div class="score-row"><span class="label">About — First 2 Lines</span><span class="score mid mono">6/10</span></div>
<p class="reaction">Recruiter's reaction before clicking "see more": "Okay, that's actually a real sentence. Might click."</p>
<div class="breakdown">
  <p>❌ <b>The problem:</b> <span class="quote">"I turn messy, unstructured data into insights businesses can actually act on."</span> is genuinely one of the stronger opening lines I see from freshers — but it's also a sentence that thousands of analyst profiles use almost word-for-word. It's not wrong, it's just not <i>yours</i>.</p>
  <p>🧠 <b>Why it hurts:</b> A good-but-generic hook still gets you a click, but it doesn't make you memorable in a recruiter's mental shortlist of 40 profiles reviewed that day.</p>
  <p>🔍 <b>The invisible cost:</b> Nothing catastrophic here — this is a small tax, not a leak. Still worth sharpening since it's the single most valuable two lines on your entire profile.</p>
</div>
 
<div class="score-row"><span class="label">About — Full Section</span><span class="score mid mono">7/10</span></div>
<p class="reaction">Recruiter's reaction on finishing it: "Solid, structured, knows the analytics lifecycle. Wait — is this the same person as that headline?"</p>
<div class="breakdown">
  <p>❌ <b>The problem:</b> The body is honestly well-written — clear structure, real projects (NutriScope, NASA Space Apps), specific tools. But it never mentions your actual 4-month Data Analyst Trainee experience at Qspiders at all, and it undersells the 5+ dashboards you built there. It also has a mismatch problem: the About talks like a grounded Data/Business Analyst, but the headline talks like an AI Engineer. That inconsistency is the single biggest credibility issue on the whole profile.</p>
  <p>🧠 <b>Why it hurts:</b> Recruiters cross-reference headline → About → Experience for consistency as a trust signal. A mismatch reads as either confusion about your own positioning or exaggeration — both cost you trust before they've even reached your Experience section.</p>
  <p>🔍 <b>The invisible cost:</b> You're burying your one piece of real, recent, hands-on experience (Qspiders — 5+ live dashboards) instead of leading with it. That's your strongest fresher proof point and it's currently invisible.</p>
</div>
 
<div class="score-row"><span class="label">Experience</span><span class="score low mono">3/10</span></div>
<p class="reaction">Recruiter's reaction: "Wait, where's the actual work? All I see is a title and dates."</p>
<div class="breakdown">
  <p>❌ <b>The problem:</b> Based on what you shared, your Qspiders "Data Analyst Trainee" entry currently has no real bullets — just the fact that you used Python, SQL, Power BI, Excel and built dashboards. There's no framing of what the dashboards were for, what skill you demonstrated, or any sense of scale.</p>
  <p>🧠 <b>Why it hurts:</b> Experience is where recruiters verify your headline claims. An entry with no substantive bullets looks unfinished — like you either didn't do much or didn't bother writing it up. Given this is your ONLY work experience entry, it's carrying too much weight to be this thin.</p>
  <p>🔍 <b>The invisible cost:</b> This is your biggest single opportunity on the whole profile. Turning "I made dashboards" into structured, verb-led bullets with real context (IPL data, city health data, 5+ dashboards) could be the difference between "fresher with no evidence" and "fresher who's already shipped work."</p>
</div>
 
<div class="score-row"><span class="label">Skills &amp; Keywords</span><span class="score mid mono">6/10</span></div>
<p class="reaction">Recruiter's search-visibility check: "Shows up for Python/SQL/Power BI searches. Missing the actual job-title keywords though."</p>
<div class="breakdown">
  <p>❌ <b>The problem:</b> Your skills (Python, SQL, MySQL, Power BI, Excel, Pandas, NumPy, Data Visualization, Data Cleaning, Dashboard Development) are solid tool-level keywords, but you're missing the exact role-title keywords recruiters actually type into LinkedIn search: "Data Analyst," "Business Analyst," "Reporting," "MIS," "SQL Analyst," "BI Analyst."</p>
  <p>🧠 <b>Why it hurts:</b> LinkedIn's recruiter search weighs Skills heavily, but tool names alone don't match role-based searches. A recruiter typing "Business Analyst fresher Gurgaon" won't necessarily surface a profile that only lists "Power BI" and "Pandas."</p>
  <p>🔍 <b>The invisible cost:</b> You could be entirely absent from the exact searches recruiters run for your target titles (Data Analyst, Business Analyst, MIS Executive, Reporting Analyst, BI Analyst, SQL Analyst) even though your actual skillset qualifies you.</p>
</div>
 
<div class="overall-box">
  <span>Overall Profile Strength</span>
  <span class="num mono">44/100</span>
</div>
`;
mainEl.appendChild(roast);

<h2 class="section-title">Part 2 — The Rebuild</h2>
 
<h3 style="font-family:Arial, sans-serif; font-size:1.05rem;">Headline — 3 options</h3>
<p style="font-family:Arial, sans-serif; font-size:0.9rem; color:var(--muted);">Formula: [Role/Identity] | [Who I Help or What I Do] | [Proof or Differentiator]</p>
 
<div class="option-card">

  <div class="why"><b>Why:</b> Leads with the exact role recruiters search for, packs in the three tools most searched alongside "Data Analyst," and closes with a concrete proof number pulled straight from your real experience. Use this if your #1 goal is showing up in recruiter search results.</div>

<div class="option-card">
  <div class="tag">OPTION 2 — Value-Proposition Style (for hiring manager attraction)</div>

</div>
 
<p style="font-family:Arial, sans-serif; font-size:0.88rem; background:#fff3ea; border-left:3px solid var(--red); padding:10px 14px;">
⚠️ <b>Dropped from all 3:</b> "AI Engineer" and "GenAI Developer." Nothing you've told me — NutriScope, NASA Space Apps, Qspiders — is GenAI/LLM engineering work. Keep "AI-powered" as a description of NutriScope if you want, but don't claim the job title. If you actually build a GenAI/LLM project later, that's when this claim gets earned.

<p style="font-family:Arial, sans-serif; font-size:0.85rem; color:var(--muted);">Note: I've kept these grounded in exactly what you described (training-style datasets, dashboard building, SQL/Python/Excel) — no invented client names, team sizes, or business impact numbers since you didn't provide them. If Qspiders was a training program rather than live client work, consider adding one line noting the program name/structure for context — recruiters read "Trainee" roles differently when they know if it was instructor-led or self-directed.</p>

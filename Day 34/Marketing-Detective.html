<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marketing Detective</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg-0:#070c14;
  --bg-1:#0d1524;
  --board:#0a1220;
  --cork:#12203a;
  --panel:#101b30;
  --panel-2:#152238;
  --border:#233657;
  --accent:#3fa9ff;
  --accent-2:#7cd0ff;
  --accent-glow:rgba(63,169,255,0.45);
  --gold-real:#f2c94c;
  --paper:#f4ecd8;
  --paper-2:#eee2c4;
  --ink:#241a0f;
  --red:#ff5c5c;
  --green:#4de08f;
  --text:#dce8fb;
  --text-dim:#8ea3c4;
  --shadow: 0 20px 60px rgba(0,0,0,.55);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family: 'Georgia', 'Times New Roman', serif;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(63,169,255,0.08), transparent 55%),
    radial-gradient(ellipse at 80% 100%, rgba(63,169,255,0.06), transparent 55%),
    linear-gradient(180deg, var(--bg-0), var(--bg-1));
  color:var(--text);
  min-height:100%;
  overflow-x:hidden;
}
.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:24px 16px 60px;
  position:relative;
}
.grain{
  pointer-events:none;
  position:fixed;inset:0;
  opacity:.05;
  background-image: repeating-radial-gradient(circle at 0 0, #fff 0, transparent 1px);
  background-size: 3px 3px;
  z-index:1000;
  mix-blend-mode:overlay;
}
.vignette{
  pointer-events:none;
  position:fixed;inset:0;
  box-shadow: inset 0 0 220px rgba(0,0,0,.85);
  z-index:999;
}
h1,h2,h3{ font-family: 'Georgia', serif; letter-spacing:.5px;}
.title-badge{
  display:flex; align-items:center; gap:14px; margin-bottom:6px;
}
.title-badge .lamp{
  width:14px;height:14px;border-radius:50%;
  background:var(--accent-2);
  box-shadow: 0 0 18px 6px var(--accent-glow);
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{ box-shadow: 0 0 12px 4px var(--accent-glow); }
  50%{ box-shadow: 0 0 24px 10px var(--accent-glow); }
}
.app-title{
  font-size:2.3rem;
  color:var(--text);
  text-shadow: 0 0 24px var(--accent-glow);
  margin:0;
}
.app-sub{
  color:var(--text-dim);
  font-size:.95rem;
  margin-top:2px;
  font-style:italic;
}
.stage{
  width:100%;
  max-width:1180px;
  margin-top:22px;
}

/* Buttons */
.btn{
  font-family:'Georgia',serif;
  cursor:pointer;
  border:1px solid var(--border);
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  color:var(--text);
  padding:12px 22px;
  border-radius:8px;
  font-size:1rem;
  letter-spacing:.4px;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
  box-shadow: 0 4px 14px rgba(0,0,0,.4);
}
.btn:hover{
  transform: translateY(-2px);
  border-color: var(--accent);
  box-shadow: 0 8px 24px rgba(0,0,0,.5), 0 0 18px var(--accent-glow);
}
.btn:active{ transform: translateY(0px) scale(.98); }
.btn.primary{
  background: linear-gradient(180deg, var(--accent), #1f7fd1);
  color:#04101d;
  font-weight:bold;
  border-color: var(--accent);
}
.btn.primary:hover{ box-shadow: 0 8px 30px var(--accent-glow); }
.btn.ghost{ background:transparent; }
.btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }

/* ---------- INTRO SCREEN ---------- */
.intro{
  display:flex;flex-direction:column;align-items:center;
  text-align:center;
  gap:22px;
  padding:40px 20px;
  animation: fadeIn .8s ease;
}
.badge-emblem{
  width:120px;height:120px;border-radius:50%;
  border:3px solid var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-size:2.6rem;
  background: radial-gradient(circle, rgba(63,169,255,.15), transparent 70%);
  box-shadow: 0 0 40px var(--accent-glow), inset 0 0 20px rgba(63,169,255,.2);
  animation: floaty 4s ease-in-out infinite;
}
@keyframes floaty{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.intro p.lead{
  max-width:560px;
  color:var(--text-dim);
  line-height:1.7;
  font-size:1.05rem;
}
.case-file-preview{
  width:100%;max-width:420px;
  background: var(--paper);
  color:var(--ink);
  border-radius:4px;
  padding:20px 24px;
  box-shadow: var(--shadow), 0 0 0 6px rgba(0,0,0,.2);
  position:relative;
  transform: rotate(-1.2deg);
  font-family: 'Courier New', monospace;
}
.case-file-preview::before{
  content:"CONFIDENTIAL";
  position:absolute; top:10px; right:16px;
  color:#b33; font-weight:bold; font-size:.7rem; letter-spacing:2px;
  border:2px solid #b33; padding:2px 6px; transform:rotate(8deg);
  opacity:.7;
}
.stamp-pin{
  position:absolute; top:-14px; left:50%; transform:translateX(-50%);
  width:22px;height:22px;border-radius:50%;
  background: radial-gradient(circle at 35% 30%, #ff8a8a, #b33 60%, #7a1f1f);
  box-shadow: 0 4px 8px rgba(0,0,0,.5);
}

/* ---------- CASE ASSIGNMENT ---------- */
.folder-wrap{
  perspective:1200px;
}
.folder{
  width:min(90vw,560px);
  background: linear-gradient(180deg, #a9772f, #8a5f22);
  border-radius:6px 6px 3px 3px;
  padding:26px 26px 34px;
  box-shadow: var(--shadow);
  position:relative;
  color:#2a1a08;
  cursor:pointer;
  transition: transform .5s cubic-bezier(.2,.8,.2,1);
  transform-style:preserve-3d;
}
.folder:hover{ transform: translateY(-6px) rotateX(2deg); }
.folder .tab{
  position:absolute; top:-16px; left:26px;
  background:#8a5f22;
  padding:6px 18px;
  border-radius:6px 6px 0 0;
  font-weight:bold;
  color:#f2e6cf;
  letter-spacing:1px;
  font-size:.8rem;
}
.folder-inner{
  background: var(--paper);
  border-radius:3px;
  padding:26px;
  min-height:160px;
  box-shadow: inset 0 0 20px rgba(0,0,0,.15);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;
  text-align:center;
}
.folder-inner .glyph{ font-size:2.4rem; }
.folder-inner p{ color:#6a5636; font-style:italic; margin:0; }

/* ---------- INVESTIGATION BOARD ---------- */
.board-header{
  display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:14px;
  margin-bottom:18px;
}
.case-heading{
  display:flex; flex-direction:column; gap:4px;
}
.case-heading .co{
  font-size:1.6rem; color:var(--accent-2); text-shadow:0 0 16px var(--accent-glow);
}
.case-heading .industry-tag{
  display:inline-block;
  font-family: 'Courier New', monospace;
  font-size:.75rem;
  color:var(--bg-0);
  background:var(--accent-2);
  padding:3px 10px;
  border-radius:20px;
  letter-spacing:1px;
  width:fit-content;
}
.progress-wrap{
  display:flex; align-items:center; gap:10px;
  color:var(--text-dim); font-size:.85rem;
}
.progress-track{
  width:160px; height:8px; border-radius:6px;
  background:var(--panel-2);
  overflow:hidden;
  border:1px solid var(--border);
}
.progress-fill{
  height:100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  box-shadow: 0 0 10px var(--accent-glow);
  transition: width .5s ease;
}

.corkboard{
  background:
    radial-gradient(circle at 10% 10%, rgba(255,255,255,.03), transparent 40%),
    repeating-linear-gradient(45deg, var(--cork), var(--cork) 2px, #0e1c33 2px, #0e1c33 4px);
  border:10px solid #1c1408;
  border-image: linear-gradient(180deg,#3a2510,#1c1408) 1;
  border-radius:10px;
  padding:26px;
  box-shadow: var(--shadow), inset 0 0 60px rgba(0,0,0,.6);
  position:relative;
}

.tabs-row{
  display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;
}
.tab-btn{
  font-family:'Courier New',monospace;
  font-size:.78rem;
  letter-spacing:.6px;
  padding:8px 14px;
  border-radius:6px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text-dim);
  cursor:pointer;
  transition:all .2s ease;
  position:relative;
}
.tab-btn.active{
  color:#04101d;
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  border-color:var(--accent);
  box-shadow: 0 0 14px var(--accent-glow);
}
.tab-btn .dot-found{
  display:inline-block; width:6px;height:6px;border-radius:50%;
  background:var(--green); margin-left:6px; box-shadow:0 0 6px var(--green);
}

.evidence-grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(240px,1fr));
  gap:20px;
  min-height:220px;
}

.sticky{
  background: var(--paper);
  color:var(--ink);
  padding:16px;
  border-radius:2px;
  min-height:150px;
  box-shadow: 3px 6px 14px rgba(0,0,0,.45);
  transform: rotate(var(--r,-1deg));
  position:relative;
  cursor:grab;
  transition: transform .25s ease, box-shadow .25s ease;
  font-family:'Courier New',monospace;
  font-size:.85rem;
  line-height:1.5;
  user-select:none;
}
.sticky:nth-child(2n){ --r:1.3deg; background:#eef0dd; }
.sticky:nth-child(3n){ --r:-0.6deg; background:#f6ead0; }
.sticky:nth-child(4n){ --r:0.9deg; }
.sticky:hover{ transform: rotate(0deg) translateY(-6px) scale(1.03); box-shadow: 6px 14px 26px rgba(0,0,0,.55), 0 0 18px var(--accent-glow); z-index:5; }
.sticky.dragging{ opacity:.5; }
.sticky .pin{
  position:absolute; top:-10px; left:50%; transform:translateX(-50%);
  width:16px;height:16px;border-radius:50%;
  background: radial-gradient(circle at 35% 30%, #ffd27a, #c98a1c 65%, #7a4e0d);
  box-shadow:0 3px 6px rgba(0,0,0,.5);
}
.sticky h4{
  margin:6px 0 8px; font-family:'Georgia',serif; font-size:.95rem; color:#432b0a;
  border-bottom:1px dashed #8a7250; padding-bottom:6px;
}
.sticky .val{ font-weight:bold; }
.sticky.clue-card{
  background: #12203a;
  color: var(--text);
  border:1px solid var(--border);
}
.sticky.clue-card h4{ color:var(--accent-2); border-bottom-color:var(--border); }
.sticky.clue-card .pin{ background: radial-gradient(circle at 35% 30%, #9fd8ff, #3fa9ff 60%, #1c5b8f); }

.metrics-panel{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px;
}
.metric-card{
  background: var(--panel);
  border:1px solid var(--border);
  border-radius:8px;
  padding:14px;
  text-align:center;
}
.metric-card .label{ font-size:.72rem; color:var(--text-dim); letter-spacing:1px; text-transform:uppercase;}
.metric-card .value{ font-size:1.5rem; color:var(--accent-2); font-weight:bold; margin-top:4px; text-shadow:0 0 10px var(--accent-glow);}
.bar-outer{
  width:100%; height:8px; background:var(--panel-2); border-radius:6px; margin-top:8px; overflow:hidden; border:1px solid var(--border);
}
.bar-inner{
  height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); width:0%;
  transition:width 1.1s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 0 10px var(--accent-glow);
}

.channels-list, .budget-list{ display:flex; flex-direction:column; gap:10px; }
.channel-row, .budget-row{
  display:flex; justify-content:space-between; align-items:center;
  background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:10px 14px;
}
.channel-row .bar-outer, .budget-row .bar-outer{ flex:1; margin:0 14px; }

.comments-list{ display:flex; flex-direction:column; gap:12px; }
.comment-bubble{
  background: var(--panel);
  border:1px solid var(--border);
  border-left:3px solid var(--accent);
  border-radius:0 8px 8px 8px;
  padding:12px 14px;
  font-style:italic;
  color:var(--text);
  position:relative;
}
.comment-bubble::before{ content:"“"; color:var(--accent-2); font-size:1.4rem; margin-right:4px; }

.social-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }

/* Magnifier / clue reveal */
.reveal-btn{
  margin-top:12px;
  font-size:.75rem;
  padding:6px 10px;
}

/* ---------- SOLVE PANEL ---------- */
.solve-panel{
  margin-top:26px;
  background: var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:22px;
  box-shadow: var(--shadow);
}
.solve-panel h3{ color:var(--accent-2); margin-top:0; }
.option-list{ display:flex; flex-direction:column; gap:10px; margin-top:14px;}
.option-btn{
  text-align:left;
  padding:14px 16px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--panel-2);
  color:var(--text);
  cursor:pointer;
  font-family:'Georgia',serif;
  font-size:.95rem;
  transition: all .2s ease;
  display:flex; gap:12px; align-items:flex-start;
}
.option-btn:hover{ border-color:var(--accent); box-shadow:0 0 14px var(--accent-glow); transform:translateX(4px); }
.option-btn .letter{
  flex:0 0 auto; width:26px;height:26px;border-radius:50%;
  background:var(--panel); border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:.8rem; color:var(--accent-2);
}
.option-btn.correct{ border-color:var(--green); box-shadow:0 0 16px rgba(77,224,143,.4); background: rgba(77,224,143,.08);}
.option-btn.incorrect{ border-color:var(--red); box-shadow:0 0 16px rgba(255,92,92,.35); background: rgba(255,92,92,.08);}
.option-btn:disabled{ cursor:default; }

/* ---------- CASE CLOSED ---------- */
.closed-wrap{
  display:flex; flex-direction:column; align-items:center; gap:18px;
  text-align:center; padding:50px 20px;
  animation: fadeIn .6s ease;
}
.stamp{
  font-size:3rem; font-weight:bold; color:var(--red);
  border:6px solid var(--red);
  padding:10px 30px;
  border-radius:8px;
  transform: rotate(-8deg) scale(0);
  letter-spacing:4px;
  text-transform:uppercase;
  animation: stampIn .5s cubic-bezier(.2,1.4,.4,1) forwards .2s;
  box-shadow: 0 0 30px rgba(255,92,92,.4);
}
@keyframes stampIn{
  0%{ transform: rotate(-8deg) scale(3); opacity:0; }
  60%{ opacity:1;}
  100%{ transform: rotate(-8deg) scale(1); opacity:1;}
}
.confetti-note{ color:var(--text-dim); font-style:italic; }

/* ---------- LEARNING REPORT ---------- */
.report{
  background: var(--paper);
  color:var(--ink);
  border-radius:6px;
  padding:30px;
  box-shadow: var(--shadow);
  font-family:'Georgia',serif;
  position:relative;
}
.report::before{
  content:"CASE FILE — CLOSED";
  position:absolute; top:16px; right:24px; color:#b33; font-weight:bold; font-size:.75rem; letter-spacing:2px; opacity:.6;
}
.report h2{ margin-top:0; color:#241a0f; border-bottom:2px solid #8a5f22; padding-bottom:10px;}
.report-section{ margin-bottom:18px; }
.report-section h4{ color:#6a4a1c; margin-bottom:6px; font-size:.9rem; letter-spacing:1px; text-transform:uppercase;}
.report-section p, .report-section li{ line-height:1.6; }
.improve-list{ padding-left:18px; }
.score-box{
  display:flex; gap:16px; flex-wrap:wrap; margin-bottom:20px;
}
.score-chip{
  background:#2a1a08; color:#f2e6cf; padding:10px 16px; border-radius:20px; font-size:.85rem;
}

/* fade */
.fadeSection{ animation: fadeIn .5s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.footer-actions{ display:flex; gap:14px; justify-content:center; margin-top:24px; flex-wrap:wrap;}

@media (max-width: 640px){
  .app-title{ font-size:1.7rem; }
  .corkboard{ padding:16px; }
  .evidence-grid{ grid-template-columns:1fr; }
}
</style>
</head>
<body>
<div class="grain"></div>
<div class="vignette"></div>
<div id="root"></div>

<script>
/* ===================== DATA: 12 CASES ===================== */
const CASES = [
{
  company:"LumaBrew Coffee Co.",
  industry:"Food & Beverage",
  objective:"Drive trial of a new cold-brew line among young professionals in urban areas.",
  audience:"Ages 22–34, urban commuters, coffee enthusiasts, moderate income.",
  channels:{"Instagram Ads":35,"Influencer Posts":25,"Email":15,"Radio":15,"Print Flyers":10},
  budget:{"Creative Production":30,"Paid Media":45,"Influencer Fees":15,"Analytics Tools":10},
  metrics:{reach:"1.2M", ctr:"0.4%", engagement:"2.1%", conversions:"0.3%", sales:"$18,400"},
  comments:[
    "Saw the ad three times today, still don't know what the product actually tastes like.",
    "Cute video, but I forgot the brand name five minutes later.",
    "Where do I even buy this? The ad didn't say."
  ],
  social:{"Likes":"14K","Shares":"320","Comments":"890","Follower Growth":"+1.2%"},
  mistake:"The campaign optimized purely for reach and aesthetic appeal, without a clear, consistent call-to-action or purchase path.",
  clues:[
    "CTR is unusually low (0.4%) despite very high reach — people are seeing the ad but not clicking.",
    "Customer comments repeatedly mention not knowing where to purchase the product.",
    "Budget allocation favors flashy creative (45% paid media, 15% influencers) over conversion-focused tactics like retargeting or clear landing pages."
  ],
  explanation:"LumaBrew built broad awareness but never built a bridge from attention to action. The ads were visually strong but lacked a consistent CTA, a trackable purchase link, or retargeting to recapture interested viewers, so awareness never converted into trial.",
  improvements:[
    "Add a single, consistent CTA across all creative (e.g., 'Find it near you' with a store locator link).",
    "Deploy retargeting ads to users who engaged but didn't convert.",
    "Shift 10–15% of budget from broad awareness spend into conversion-focused landing pages and email capture."
  ]
},
{
  company:"NovaFit Wearables",
  industry:"Consumer Electronics / Fitness Tech",
  objective:"Launch a new fitness tracker and generate 5,000 pre-orders in 60 days.",
  audience:"Ages 25–45, fitness enthusiasts, tech-savvy, mid-to-high income.",
  channels:{"YouTube Pre-roll":30,"Google Search Ads":25,"Facebook Ads":20,"Podcast Sponsorships":15,"PR":10},
  budget:{"Media Buy":50,"Production":20,"Sponsorships":20,"Contingency":10},
  metrics:{reach:"2.4M", ctr:"1.8%", engagement:"4.5%", conversions:"0.15%", sales:"612 pre-orders"},
  comments:[
    "I clicked through excited, but the checkout page asked me to create an account before I could even see the price.",
    "Took forever to load on my phone, gave up.",
    "Why do I need to fill out 12 fields just to pre-order?"
  ],
  social:{"Likes":"22K","Shares":"1.1K","Comments":"1.4K","Follower Growth":"+3.4%"},
  mistake:"A high-friction checkout and landing page experience caused massive drop-off between click and purchase, despite strong upper-funnel performance.",
  clues:[
    "CTR (1.8%) and engagement (4.5%) are strong — the creative and targeting are working well.",
    "Conversion rate (0.15%) is dramatically lower than industry norms for this level of engagement, indicating a funnel problem, not a targeting problem.",
    "Customer comments specifically cite slow load times and an overly long checkout process."
  ],
  explanation:"NovaFit's marketing did its job — it attracted and engaged the right audience. The failure happened after the click: a slow, cluttered, account-gated checkout flow caused interested buyers to abandon before completing a pre-order.",
  improvements:[
    "Simplify checkout to guest-only with under 5 required fields.",
    "Run mobile page-speed audits and compress landing page assets.",
    "A/B test a one-click 'reserve with email only' pre-order option."
  ]
},
{
  company:"GreenLeaf Organics",
  industry:"CPG / Grocery",
  objective:"Increase market share for a new organic snack line against an established competitor.",
  audience:"Health-conscious parents, ages 30–50, suburban, higher disposable income.",
  channels:{"TV Spots":30,"Facebook/Instagram":25,"In-store Sampling":25,"Coupons":20},
  budget:{"TV Production & Airtime":55,"Digital":20,"Sampling Events":15,"Coupon Printing":10},
  metrics:{reach:"3.1M", ctr:"0.9%", engagement:"1.6%", conversions:"0.8%", sales:"$92,000"},
  comments:[
    "Tried it at the sampling table, liked it, but couldn't find it on the shelf at my regular store.",
    "Coupon expired before I got around to using it.",
    "Ad felt like it was made for a totally different, younger crowd than the actual shoppers."
  ],
  social:{"Likes":"9K","Shares":"210","Comments":"340","Follower Growth":"+0.6%"},
  mistake:"Misalignment between the campaign's creative tone/audience and the actual in-store shopper demographic, compounded by limited distribution.",
  clues:[
    "Sampling generates positive reactions, but sales don't follow, suggesting a distribution gap rather than a product problem.",
    "Comments mention the ad's tone feeling mismatched to the actual (older, parent-focused) buyer.",
    "Engagement rate (1.6%) is low for a CPG brand with 3.1M reach, hinting the creative isn't resonating with who's actually seeing it."
  ],
  explanation:"GreenLeaf spent heavily on broad TV reach with youth-skewed creative, while its real buyers were pragmatic parents shopping in specific stores. Limited shelf distribution meant even interested customers often couldn't find the product.",
  improvements:[
    "Realign creative tone and messaging to resonate with parent decision-makers.",
    "Prioritize distribution expansion to stores near sampling event locations before scaling media spend.",
    "Extend coupon validity windows and add digital coupon reminders."
  ]
},
{
  company:"Skyline Realty Group",
  industry:"Real Estate",
  objective:"Generate qualified leads for luxury condo listings in a new development.",
  audience:"Ages 35–60, high net worth, first-time luxury buyers or investors.",

/* ===================== UTILITIES ===================== */
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pickRandomCase(excludeIdx){
  let idx;
  do{ idx = Math.floor(Math.random()*CASES.length); }
  while(CASES.length>1 && idx===excludeIdx);
  return idx;
}
function buildOptions(theCase, allCases){
  // one correct + 3 plausible distractors (other cases' mistakes, reworded lightly)
  const others = allCases.filter(c=>c!==theCase);
  const distractors = shuffle(others).slice(0,3).map(c=>c.mistake);
  const opts = shuffle([theCase.mistake, ...distractors]);
  return opts;
}

/* ===================== APP STATE ===================== */
const root = document.getElementById('root');

let state = {
  screen: 'intro', // intro -> assignment -> board -> solve -> closed -> report
  caseIdx: null,
  foundClues: new Set(),
  activeTab: 'overview',
  solveOptions: [],
  selectedOption: null,
  answered: false,
  correct: false,
};

function render(){
  root.innerHTML = '';
  if(state.screen==='intro') root.appendChild(IntroScreen());
  else if(state.screen==='assignment') root.appendChild(AssignmentScreen());
  else if(state.screen==='board') root.appendChild(BoardScreen());
  else if(state.screen==='closed') root.appendChild(ClosedScreen());
  else if(state.screen==='report') root.appendChild(ReportScreen());
}

/* ===================== SCREENS ===================== */
function Shell(innerNode){
  const wrap = document.createElement('div');
  wrap.className = 'app';
  const badge = document.createElement('div');
  badge.className = 'title-badge';
  badge.innerHTML = `<span class="lamp"></span><div><h1 class="app-title">Marketing Detective</h1><div class="app-sub">Case files from the Bureau of Broken Campaigns</div></div>`;
  wrap.appendChild(badge);
  const stage = document.createElement('div');
  stage.className='stage';
  stage.appendChild(innerNode);
  wrap.appendChild(stage);
  return wrap;
}

function IntroScreen(){
  const el = document.createElement('div');
  el.className='intro';
  el.innerHTML = `
    <div class="badge-emblem">🔍</div>
    <p class="lead">Somewhere out there, a marketing campaign has failed — and nobody knows why. Sales numbers, customer comments, and social chatter are the only clues left behind. You are the detective. Read the evidence, follow the trail, and name the mistake before the trail goes cold.</p>
    <div class="case-file-preview">
      <div class="stamp-pin"></div>
      <div style="font-weight:bold;letter-spacing:2px;margin-bottom:6px;">CASE #????</div>
      <div style="opacity:.7;">Company: <span style="filter:blur(3px)">REDACTED</span></div>
      <div style="opacity:.7;">Status: <span style="color:#b33;">UNSOLVED</span></div>
    </div>
    <button class="btn primary" id="startBtn">Accept the Case</button>
  `;
  el.querySelector('#startBtn').addEventListener('click', ()=>{
    state.caseIdx = pickRandomCase(null);
    state.screen='assignment';
    render();
  });
  return Shell(el);
}

function AssignmentScreen(){
  const c = CASES[state.caseIdx];
  const el = document.createElement('div');
  el.className='fadeSection';
  el.style.display='flex'; el.style.justifyContent='center';
  el.innerHTML = `
    <div class="folder-wrap">
      <div class="folder" id="folderCard">
        <div class="tab">CASE #${(state.caseIdx+1).toString().padStart(3,'0')}</div>
        <div class="folder-inner">
          <div class="glyph">📁</div>
          <p>Click to open the case file...</p>
        </div>
      </div>
    </div>
  `;
  el.querySelector('#folderCard').addEventListener('click', ()=>{
    state.screen='board';
    state.activeTab='overview';
    state.foundClues = new Set();
    const opts = buildOptions(c, CASES);
    state.solveOptions = opts;
    state.selectedOption = null;
    state.answered=false;
    render();
  });
  return Shell(el);
}

const TABS = [
  {id:'overview', label:'Overview'},
  {id:'metrics', label:'Campaign Metrics'},
  {id:'channels', label:'Channels & Budget'},
  {id:'comments', label:'Customer Comments'},
  {id:'social', label:'Social Performance'},
  {id:'clues', label:'Supporting Clues'},
];

function BoardScreen(){
  const c = CASES[state.caseIdx];
  const el = document.createElement('div');

  // header
  const header = document.createElement('div');
  header.className='board-header fadeSection';
  const pct = Math.round((state.foundClues.size/3)*100);
  header.innerHTML = `
    <div class="case-heading">
      <div class="co">${c.company}</div>
      <span class="industry-tag">${c.industry}</span>
      <div style="color:var(--text-dim); font-size:.85rem; max-width:520px; margin-top:6px;">🎯 Objective: ${c.objective}</div>
      <div style="color:var(--text-dim); font-size:.85rem; max-width:520px;">👥 Audience: ${c.audience}</div>
    </div>
    <div class="progress-wrap">
      <span>Clues found: ${state.foundClues.size}/3</span>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
  `;
  el.appendChild(header);

  const board = document.createElement('div');
  board.className='corkboard fadeSection';

  const tabsRow = document.createElement('div');
  tabsRow.className='tabs-row';
  TABS.forEach(t=>{
    const b = document.createElement('button');
    b.className = 'tab-btn'+(state.activeTab===t.id?' active':'');
    b.textContent = t.label;
    if(t.id==='clues' && state.foundClues.size>0){
      b.innerHTML += ` <span class="dot-found"></span>${state.foundClues.size}`;
    }
    b.addEventListener('click', ()=>{ state.activeTab=t.id; render(); });
    tabsRow.appendChild(b);
  });
  board.appendChild(tabsRow);

  const content = document.createElement('div');
  content.className='fadeSection';
  content.appendChild(renderTabContent(c));
  board.appendChild(content);

  el.appendChild(board);

  // Solve panel
  const solve = document.createElement('div');
  solve.className='solve-panel fadeSection';
  solve.innerHTML = `<h3>🕵️ Ready to name the mistake?</h3><p style="color:var(--text-dim);">Review the evidence above, then choose the primary marketing mistake in this case.</p>`;
  const optList = document.createElement('div');
  optList.className='option-list';
  const letters=['A','B','C','D'];
  state.solveOptions.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className='option-btn';
    b.disabled = state.answered;
    if(state.answered){
      if(opt===c.mistake) b.classList.add('correct');
      else if(opt===state.selectedOption) b.classList.add('incorrect');
    }
    b.innerHTML = `<span class="letter">${letters[i]}</span><span>${opt}</span>`;
    b.addEventListener('click', ()=>{
      if(state.answered) return;
      state.selectedOption = opt;
      state.answered = true;
      state.correct = (opt===c.mistake);
      render();
    });
    optList.appendChild(b);
  });
  solve.appendChild(optList);

  if(state.answered){
    const cont = document.createElement('div');
    cont.style.marginTop='16px';
    cont.style.display='flex'; cont.style.gap='12px'; cont.style.flexWrap='wrap';
    const verdict = document.createElement('div');
    verdict.style.fontWeight='bold';
    verdict.style.color = state.correct? 'var(--green)':'var(--red)';
    verdict.textContent = state.correct? '✔ Correct deduction, Detective.' : '✘ Not quite — but every good detective learns from a wrong lead.';
    solve.appendChild(verdict);
    const btn = document.createElement('button');
    btn.className='btn primary';
    btn.textContent='Close the Case';
    btn.addEventListener('click', ()=>{ state.screen='closed'; render(); });
    cont.appendChild(btn);
    solve.appendChild(cont);
  }

  el.appendChild(solve);
  return Shell(el);
}

function metricBar(label, valueStr, pct){
  const div = document.createElement('div');
  div.className='metric-card';
  div.innerHTML = `<div class="label">${label}</div><div class="value">${valueStr}</div><div class="bar-outer"><div class="bar-inner"></div></div>`;
  setTimeout(()=>{ div.querySelector('.bar-inner').style.width = pct+'%'; }, 60);
  return div;
}

    chWrap.innerHTML = '<h4 style="color:var(--accent-2);margin-bottom:10px;">Marketing Channels (%)</h4>';
    const chList = document.createElement('div'); chList.className='channels-list';
    Object.entries(c.channels).forEach(([k,v])=>{
      const row=document.createElement('div'); row.className='channel-row';
      row.innerHTML = `<span>${k}</span><div class="bar-outer"><div class="bar-inner"></div></div><span>${v}%</span>`;
      chList.appendChild(row);
      setTimeout(()=>{row.querySelector('.bar-inner').style.width=v+'%';},60);
    });
    chWrap.appendChild(chList);
    const bWrap = document.createElement('div');
    bWrap.innerHTML = '<h4 style="color:var(--accent-2);margin-bottom:10px;">Budget Allocation (%)</h4>';
    const bList = document.createElement('div'); bList.className='budget-list';
    Object.entries(c.budget).forEach(([k,v])=>{
      const row=document.createElement('div'); row.className='budget-row';
      row.innerHTML = `<span>${k}</span><div class="bar-outer"><div class="bar-inner"></div></div><span>${v}%</span>`;
      bList.appendChild(row);
      setTimeout(()=>{row.querySelector('.bar-inner').style.width=v+'%';},60);
    });
    bWrap.appendChild(bList);
    container.appendChild(chWrap); container.appendChild(bWrap);
    wrap.appendChild(container);
    if(window.innerWidth<640){ container.style.gridTemplateColumns='1fr'; }
  }
  else if(state.activeTab==='comments'){
    wrap.className='comments-list';
    c.comments.forEach(cm=>{
      const b=document.createElement('div'); b.className='comment-bubble'; b.textContent=cm;
      wrap.appendChild(b);
    });
  }
  else if(state.activeTab==='social'){
    wrap.className='social-grid';
    Object.entries(c.social).forEach(([k,v])=>{
      const card=document.createElement('div'); card.className='metric-card';
      card.innerHTML = `<div class="label">${k}</div><div class="value" style="font-size:1.1rem;">${v}</div>`;
      wrap.appendChild(card);
    });
  }
  else if(state.activeTab==='clues'){
    wrap.className='evidence-grid';
    c.clues.forEach((clue,i)=>{
      const found = state.foundClues.has(i);
      const card = document.createElement('div');
      card.className='sticky clue-card';
      if(found){
        card.innerHTML = `<div class="pin"></div><h4>Clue ${i+1} 🔎</h4><div>${clue}</div>`;
      } else {
        card.innerHTML = `<div class="pin"></div><h4>Clue ${i+1} — Concealed</h4><div style="filter:blur(4px); user-select:none;">${clue}</div><button class="btn reveal-btn">Examine Evidence</button>`;
        card.querySelector('.reveal-btn').addEventListener('click',(ev)=>{
          ev.stopPropagation();
          state.foundClues.add(i);
          render();
        });
      }
      makeDraggable(card);
      wrap.appendChild(card);
    });
  }
  return wrap;
}

/* simple drag effect (visual only, evidence corkboard feel) */
function makeDraggable(node){
  node.setAttribute('draggable','true');
  node.addEventListener('dragstart', ()=> node.classList.add('dragging'));
  node.addEventListener('dragend', ()=> node.classList.remove('dragging'));
}

function ClosedScreen(){
  const c = CASES[state.caseIdx];
  const el = document.createElement('div');
  el.className='closed-wrap';
  el.innerHTML = `
    <div class="stamp">Case Closed</div>
    <p class="confetti-note">The file on <strong style="color:var(--accent-2)">${c.company}</strong> has been archived. Time to review your deductions.</p>
    <div class="footer-actions">
      <button class="btn primary" id="reportBtn">View Learning Report</button>
    </div>
  `;
  el.querySelector('#reportBtn').addEventListener('click', ()=>{ state.screen='report'; render(); });
  return Shell(el);
}

function ReportScreen(){
  const c = CASES[state.caseIdx];
  const el = document.createElement('div');
  el.className='fadeSection';
  const report = document.createElement('div');
  report.className='report';
  report.innerHTML = `
    <h2>Learning Report — ${c.company}</h2>
    <div class="score-box">
      <div class="score-chip">Verdict: ${state.correct? 'Correct ✔':'Incorrect ✘'}</div>
      <div class="score-chip">Clues Examined: ${state.foundClues.size}/3</div>
      <div class="score-chip">Industry: ${c.industry}</div>
    </div>
    <div class="report-section">
      <h4>The Primary Mistake</h4>
      <p>${c.mistake}</p>
    </div>
    <div class="report-section">
      <h4>Full Explanation</h4>
      <p>${c.explanation}</p>
    </div>
    <div class="report-section">
      <h4>Supporting Clues</h4>
      <ul class="improve-list">${c.clues.map(cl=>`<li>${cl}</li>`).join('')}</ul>
    </div>
    <div class="report-section">
      <h4>Suggested Improvements</h4>
      <ul class="improve-list">${c.improvements.map(im=>`<li>${im}</li>`).join('')}</ul>
    </div>
  `;
  el.appendChild(report);
  const actions = document.createElement('div');
  actions.className='footer-actions';
  actions.innerHTML = `<button class="btn primary" id="newCaseBtn">Take a New Case</button>`;
  actions.querySelector('#newCaseBtn').addEventListener('click', ()=>{
    state.caseIdx = pickRandomCase(state.caseIdx);
    state.screen='assignment';
    render();
  });
  el.appendChild(actions);
  return Shell(el);
}

/* ===================== INIT ===================== */
render();
</script>
</body>
</html>
